controller:
  replicas: 1

  # Builds should run on Kubernetes agents, not on the controller.
  numExecutors: 0

  serviceType: ClusterIP
  servicePort: 8080
  targetPort: 8080

  admin:
    username: "admin"
    createSecret: true

  initializeOnce: true

  # Keep plugin dependency resolution deterministic.
  installLatestPlugins: false

  # Pin the Jenkins chart base plugins explicitly so a chart upgrade
  # does not implicitly change plugin versions.
  installPlugins:
    - kubernetes:4540.v612369217f87
    - workflow-aggregator:608.v67378e9d3db_1
    - git:5.10.1
    - configuration-as-code:2117.vc05a_0b_e6b_f4e

  additionalPlugins:
    - role-strategy:898.vc050ed2424ca_
    - pipeline-build-step:601.v6d4c6d1a_9dc7
    - pipeline-groovy-lib:805.va_fc79344957d
    - script-security:1415.v9a_f9b_3a_c253d
    - generic-webhook-trigger:2.4.3
    - json-path-api:2.9.0-148.v22a_7ffe323ce

  # Mount the existing AlertManager service-account password
  # without storing the secret value in Git.
  additionalExistingSecrets:
    - name: sentinel-alertmanager-credentials
      keyName: password

  JCasC:
    defaultConfig: true

    securityRealm: |-
      local:
        allowsSignup: false
        enableCaptcha: false
        users:
          - id: "${chart-admin-username}"
            name: "Jenkins Admin"
            password: "${chart-admin-password}"
          - id: "sentinel-alertmanager"
            name: "Sentinel AlertManager"
            password: "${sentinel-alertmanager-credentials-password}"

    authorizationStrategy: |-
      roleBased:
        roles:
          global:
            - name: "admin"
              permissions:
                - "Overall/Administer"
              entries:
                - user: "${chart-admin-username}"

            - name: "sentinel-alertmanager-read"
              permissions:
                - "Overall/Read"
              entries:
                - user: "sentinel-alertmanager"

          items:
            - name: "sentinel-retraining-build"
              pattern: "^sentinel-retraining$"
              permissions:
                - "Job/Read"
                - "Job/Build"
              entries:
                - user: "sentinel-alertmanager"

persistence:
  enabled: true
  storageClass: "standard"
  accessMode: "ReadWriteOnce"
  size: "8Gi"

rbac:
  create: true
  readSecrets: false

serviceAccount:
  create: true
  name: "jenkins-controller"
  automountServiceAccountToken: true

serviceAccountAgent:
  create: true
  name: "jenkins-deployer"
  automountServiceAccountToken: true

agent:
  enabled: true
  namespace: "jenkins"
  useDefaultServiceAccount: true
  serviceAccount: "jenkins-deployer"

