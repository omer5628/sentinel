          - list
          - watch
          - create
          - update
          - patch
          - delete

      - apiGroups:
          - apps
        resources:
          - deployments
          - replicasets
          - statefulsets
          - daemonsets
        verbs:
          - get
          - list
          - watch
          - create
          - update
          - patch
          - delete

      - apiGroups:
