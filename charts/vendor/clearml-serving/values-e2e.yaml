# Isolated ClearML Serving environment for Sentinel E2E tests.
# Chart version: 1.6.2

clearml:
  existingSecret: clearml-retraining-credentials

  apiAccessKey: ""
  apiSecretKey: ""

  apiHost: "http://192.168.49.1:8008"
  filesHost: "http://192.168.49.1:8081"
  webHost: "http://192.168.49.1:8080"

  # Must be replaced with a dedicated E2E Serving Task ID.
  servingTaskId: "f80299ed1fb44353a347dafe47b7dd25"

  defaultBaseServeUrl: "http://clearml-serving-e2e-inference:8080/serve"

clearml_serving_inference:
  image:
    repository: allegroai/clearml-serving-inference
    tag: "1.3.1"

  autoscaling:
    enabled: false

  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 2Gi

clearml_serving_triton:
  enabled: true

  image:
    repository: allegroai/clearml-serving-triton
    tag: "1.3.1"

  autoscaling:
    enabled: false

  resources:
    requests:
      cpu: 500m
      memory: 2Gi
    limits:
      cpu: "2"
      memory: 4Gi

clearml_serving_statistics:
  enabled: false

kafka:
  enabled: false

prometheus:
  enabled: false

grafana:
  enabled: false