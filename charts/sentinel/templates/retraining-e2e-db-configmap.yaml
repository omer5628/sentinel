{{- $bootstrap := .Values.retraining.databaseBootstrap | default dict -}}
{{- if ($bootstrap.enabled | default false) }}

{{- if ne .Release.Namespace "sentinel-dev" }}
{{- fail "E2E database configuration is allowed only in sentinel-dev" }}
{{- end }}

{{- $configMapName := required
    "retraining.database.configMapName is required"
    .Values.retraining.database.configMapName
-}}

{{- $databaseName := required
    "retraining.databaseBootstrap.databaseName is required"
    $bootstrap.databaseName
-}}

{{- if ne $configMapName "sentinel-retraining-e2e-db" }}
{{- fail "Unexpected E2E database ConfigMap name" }}
{{- end }}

{{- if ne $databaseName "sentinel_e2e" }}
{{- fail "E2E configuration must use sentinel_e2e" }}
{{- end }}

apiVersion: v1
kind: ConfigMap

metadata:
  name: {{ $configMapName | quote }}
  labels:
    app.kubernetes.io/name: sentinel
    app.kubernetes.io/component: retraining-e2e-database

data:
  POSTGRES_HOST: "postgres-0.postgres-headless.sentinel-dev.svc.cluster.local"
  POSTGRES_PORT: {{ .Values.postgres.port | quote }}
  POSTGRES_DB: {{ $databaseName | quote }}

{{- end }}
