{{- $seed := .Values.retraining.e2eDataSeed | default dict -}}
{{- if ($seed.enabled | default false) }}

{{- if ne .Release.Namespace "sentinel-dev" }}
{{- fail "E2E data seed is allowed only in sentinel-dev" }}
{{- end }}

{{- if ne .Values.retraining.pipelineName "sentinel-retraining-e2e" }}
{{- fail "E2E data seed requires the isolated retraining pipeline" }}
{{- end }}

{{- if ne .Values.retraining.database.configMapName "sentinel-retraining-e2e-db" }}
{{- fail "E2E data seed requires the isolated database ConfigMap" }}
{{- end }}

{{- if ne .Values.retraining.database.credentialsSecretName "sentinel-retraining-e2e-db-credentials" }}
{{- fail "E2E data seed requires isolated database credentials" }}
{{- end }}

apiVersion: batch/v1
kind: Job

metadata:
  name: sentinel-e2e-data-gate-seed
  labels:
    app.kubernetes.io/name: sentinel-e2e-data-gate-seed
    app.kubernetes.io/component: retraining-e2e-test
    app.kubernetes.io/part-of: sentinel

spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 3600

  template:
    metadata:
      labels:
        app.kubernetes.io/name: sentinel-e2e-data-gate-seed

    spec:
      restartPolicy: Never
      automountServiceAccountToken: false

      containers:
        - name: postgres-seed
          image: "{{ .Values.postgres.image.repository }}:{{ .Values.postgres.image.tag }}"
          imagePullPolicy: {{ .Values.postgres.image.pullPolicy }}

          env:
            - name: K8S_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace

            - name: POSTGRES_HOST
              valueFrom:
                configMapKeyRef:
                  name: "sentinel-retraining-e2e-db"
                  key: POSTGRES_HOST

            - name: POSTGRES_PORT
              valueFrom:
                configMapKeyRef:
                  name: "sentinel-retraining-e2e-db"
                  key: POSTGRES_PORT

            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: "sentinel-retraining-e2e-db"
                  key: POSTGRES_DB

            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: "sentinel-retraining-e2e-db-credentials"
                  key: POSTGRES_USER

            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: "sentinel-retraining-e2e-db-credentials"
                  key: POSTGRES_PASSWORD

          command:
            - sh
            - -c

          args:
            - |
              set -eu

              if [ "$K8S_NAMESPACE" != "sentinel-dev" ] ||
                 [ "$POSTGRES_DB" != "sentinel_e2e" ] ||
                 [ "$POSTGRES_USER" != "sentinel_e2e_user" ]; then
                  echo "ERROR: Invalid E2E seed target." >&2
                  exit 1
              fi

              export PGPASSWORD="$POSTGRES_PASSWORD"

              psql -X -v ON_ERROR_STOP=1 \
                -h "$POSTGRES_HOST" \
                -p "$POSTGRES_PORT" \
                -U "$POSTGRES_USER" \
                -d "$POSTGRES_DB" <<'SQL'

              BEGIN;

              DO $$
              BEGIN
                  IF current_database() <> 'sentinel_e2e'
                     OR current_user <> 'sentinel_e2e_user'
                  THEN
                      RAISE EXCEPTION
                          'E2E seed database identity verification failed';
                  END IF;
              END;
              $$;

              INSERT INTO feature_log (
                  event_id,
                  image_id,
                  timestamp,
                  raw_image,
                  vector,
                  label,
                  labeled_at,
                  model_version
              )
              SELECT
                  md5('sentinel-e2e-gate-fixture-' || n)::uuid,
                  'e2e-gate-' || lpad(n::text, 4, '0'),
                  CURRENT_TIMESTAMP - INTERVAL '2 minutes',
                  NULL,
                  jsonb_build_object('e2e_fixture', true),
                  'E2E_FIXTURE',
                  CURRENT_TIMESTAMP - INTERVAL '1 minute',
                  'e2e_fixture'
              FROM generate_series(1, 1000) AS n
              ON CONFLICT (event_id) DO NOTHING;

              DO $$
              DECLARE
                  fixture_count INTEGER;
              BEGIN
                  SELECT COUNT(*)
                  INTO fixture_count
                  FROM feature_log
                  WHERE model_version = 'e2e_fixture'
                    AND label = 'E2E_FIXTURE'
                    AND image_id LIKE 'e2e-gate-%';

                  IF fixture_count <> 1000 THEN
                      RAISE EXCEPTION
                          'Expected 1000 E2E fixtures, found %',
                          fixture_count;
                  END IF;

                  RAISE NOTICE
                      'E2E data gate fixtures verified: %',
                      fixture_count;
              END;
              $$;

              COMMIT;

              SQL

              echo "E2E data gate seed completed successfully."

{{- end }}