apiVersion: apps/v1
kind: Deployment

metadata:
  name: sentinel-inference-logger
  labels:
    app.kubernetes.io/name: sentinel-inference-logger
    app.kubernetes.io/component: inference-persistence
    app.kubernetes.io/part-of: sentinel

spec:
  replicas: {{ .Values.inferenceLogger.replicaCount }}

  selector:
    matchLabels:
      app.kubernetes.io/name: sentinel-inference-logger

  template:
    metadata:
      labels:
        app.kubernetes.io/name: sentinel-inference-logger
        app.kubernetes.io/component: inference-persistence
        app.kubernetes.io/part-of: sentinel

    spec:
      {{- if .Values.registry.existingPullSecret }}
      imagePullSecrets:
        - name: {{ .Values.registry.existingPullSecret | quote }}
      {{- end }}

      containers:
        - name: inference-logger
          image: "{{ .Values.worker.image.repository }}:{{ .Values.worker.image.tag }}"
          imagePullPolicy: {{ .Values.worker.image.pullPolicy }}

          command:
            - python
            - -m
            - sentinel.consumers.inference_logger

          env:
            - name: LOG_LEVEL
              valueFrom:
                configMapKeyRef:
                  name: sentinel-common-config
                  key: LOG_LEVEL

            - name: RABBITMQ_HOST
              valueFrom:
                configMapKeyRef:
                  name: sentinel-common-config
                  key: RABBITMQ_HOST

            - name: RABBITMQ_PORT
              valueFrom:
                configMapKeyRef:
                  name: sentinel-common-config
                  key: RABBITMQ_PORT

            - name: POSTGRES_HOST
              valueFrom:
                configMapKeyRef:
                  name: sentinel-common-config
                  key: POSTGRES_HOST

            - name: POSTGRES_PORT
              valueFrom:
                configMapKeyRef:
                  name: sentinel-common-config
                  key: POSTGRES_PORT

            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: sentinel-common-config
                  key: POSTGRES_DB

            - name: RABBITMQ_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.existingSecret | quote }}
                  key: RABBITMQ_USERNAME

            - name: RABBITMQ_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.existingSecret | quote }}
                  key: RABBITMQ_PASSWORD

            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.existingSecret | quote }}
                  key: POSTGRES_USER

            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.existingSecret | quote }}
                  key: POSTGRES_PASSWORD

          resources:
            requests:
              cpu: {{ .Values.inferenceLogger.resources.requests.cpu | quote }}
              memory: {{ .Values.inferenceLogger.resources.requests.memory | quote }}
            limits:
              cpu: {{ .Values.inferenceLogger.resources.limits.cpu | quote }}
              memory: {{ .Values.inferenceLogger.resources.limits.memory | quote }}