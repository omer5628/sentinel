{{- if .Values.retraining.enabled }}

{{- $runId := required
    "retraining.runId is required when retraining is enabled"
    .Values.retraining.runId
-}}

{{- $cutoff := required
    "retraining.cutoff is required when retraining checkpoint is rendered"
    .Values.retraining.cutoff
-}}

apiVersion: batch/v1
kind: Job

metadata:
  name: "sentinel-retraining-checkpoint-{{ $runId }}"
  labels:
    app.kubernetes.io/name: sentinel-retraining-checkpoint
    app.kubernetes.io/component: retraining
    app.kubernetes.io/part-of: sentinel

spec:
  backoffLimit: 0

  template:
    metadata:
      labels:
        app.kubernetes.io/name: sentinel-retraining-checkpoint
        app.kubernetes.io/component: retraining
        app.kubernetes.io/part-of: sentinel

    spec:
      restartPolicy: Never
      automountServiceAccountToken: false

      {{- if .Values.registry.existingPullSecret }}
      imagePullSecrets:
        - name: {{ .Values.registry.existingPullSecret | quote }}
      {{- end }}

      containers:
        - name: retraining-checkpoint
          image: "{{ .Values.worker.image.repository }}:{{ .Values.worker.image.tag }}"
          imagePullPolicy: {{ .Values.worker.image.pullPolicy }}

          command:
            - python
            - -m
            - sentinel.retraining.checkpoint

          env:
            - name: POSTGRES_HOST
              valueFrom:
                configMapKeyRef:
                  name: sentinel-common-config
                  key: POSTGRES_HOST

            - name: POSTGRES_PORT
              valueFrom:
                configMapKeyRef:
                  name: sentinel-common-config
                  key: POSTGRES_PORT

            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: sentinel-common-config
                  key: POSTGRES_DB

            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.existingSecret | quote }}
                  key: POSTGRES_USER

            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.existingSecret | quote }}
                  key: POSTGRES_PASSWORD

            - name: RETRAINING_PIPELINE_NAME
              value: {{ .Values.retraining.pipelineName | quote }}

            - name: RETRAINING_CUTOFF
              value: {{ $cutoff | quote }}

          resources:
            requests:
              cpu: {{ .Values.retraining.resources.requests.cpu | quote }}
              memory: {{ .Values.retraining.resources.requests.memory | quote }}

            limits:
              cpu: {{ .Values.retraining.resources.limits.cpu | quote }}
              memory: {{ .Values.retraining.resources.limits.memory | quote }}

{{- end }}