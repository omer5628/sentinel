apiVersion: v1
kind: ConfigMap

metadata:
  name: sentinel-common-config
  labels:
    app.kubernetes.io/name: sentinel
    app.kubernetes.io/component: configuration

data:
  LOG_LEVEL: {{ .Values.config.logLevel | quote }}

  RABBITMQ_HOST: "rabbitmq-0.rabbitmq-headless.{{ .Release.Namespace }}.svc.cluster.local"
  RABBITMQ_PORT: {{ .Values.rabbitmq.port | quote }}

  REDIS_HOST: "redis-0.redis-headless.{{ .Release.Namespace }}.svc.cluster.local"
  REDIS_PORT: {{ .Values.redis.port | quote }}

  POSTGRES_HOST: "postgres-0.postgres-headless.{{ .Release.Namespace }}.svc.cluster.local"
  POSTGRES_PORT: {{ .Values.postgres.port | quote }}
  POSTGRES_DB: {{ .Values.postgres.database | quote }}