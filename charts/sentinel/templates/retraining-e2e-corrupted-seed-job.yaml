{{- $seed := .Values.retraining.e2eCorruptedSeed | default dict -}}
{{- if ($seed.enabled | default false) }}

{{- if ne .Release.Namespace "sentinel-dev" }}
{{- fail "E2E corrupted seed is allowed only in sentinel-dev" }}
{{- end }}
{{- if ne .Values.retraining.pipelineName "sentinel-retraining-e2e" }}
{{- fail "E2E corrupted seed requires the isolated pipeline" }}
{{- end }}
{{- if ne .Values.retraining.database.configMapName "sentinel-retraining-e2e-db" }}
{{- fail "E2E corrupted seed requires the isolated database ConfigMap" }}
{{- end }}
{{- if ne .Values.retraining.database.credentialsSecretName "sentinel-retraining-e2e-db-credentials" }}
{{- fail "E2E corrupted seed requires isolated database credentials" }}
{{- end }}

apiVersion: batch/v1
kind: Job
metadata:
  name: sentinel-e2e-corrupted-seed
  labels:
    app.kubernetes.io/name: sentinel-e2e-corrupted-seed
    app.kubernetes.io/component: retraining-e2e-test
    app.kubernetes.io/part-of: sentinel
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sentinel-e2e-corrupted-seed
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      containers:
        - name: postgres-corrupted-seed
          image: "{{ .Values.postgres.image.repository }}:{{ .Values.postgres.image.tag }}"
          imagePullPolicy: {{ .Values.postgres.image.pullPolicy }}
          env:
            - name: K8S_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: POSTGRES_HOST
              valueFrom:
                configMapKeyRef:
                  name: sentinel-retraining-e2e-db
                  key: POSTGRES_HOST
            - name: POSTGRES_PORT
              valueFrom:
                configMapKeyRef:
                  name: sentinel-retraining-e2e-db
                  key: POSTGRES_PORT
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: sentinel-retraining-e2e-db
                  key: POSTGRES_DB
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: sentinel-retraining-e2e-db-credentials
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: sentinel-retraining-e2e-db-credentials
                  key: POSTGRES_PASSWORD
          command:
            - sh
            - -c
          args:
            - |
              set -eu

              if [ "$K8S_NAMESPACE" != "sentinel-dev" ] ||
                 [ "$POSTGRES_DB" != "sentinel_e2e" ] ||
                 [ "$POSTGRES_USER" != "sentinel_e2e_user" ]; then
                  echo "ERROR: Invalid E2E corrupted seed target." >&2
                  exit 1
              fi

              export PGPASSWORD="$POSTGRES_PASSWORD"

              psql -X -v ON_ERROR_STOP=1 \
                -h "$POSTGRES_HOST" \
                -p "$POSTGRES_PORT" \
                -U "$POSTGRES_USER" \
                -d "$POSTGRES_DB" <<'SQL'

              BEGIN;

              DO $e2e_corrupted_identity$
              BEGIN
                  IF current_database() <> 'sentinel_e2e'
                     OR current_user <> 'sentinel_e2e_user'
                  THEN
                      RAISE EXCEPTION
                          'E2E corrupted seed identity verification failed';
                  END IF;
              END;
              $e2e_corrupted_identity$;

              -- Fail closed if other labeled rows already exist in the
              -- isolated database: the learner would otherwise include them.
              -- Reserved corrupted-fixture IDs may exist from a prior attempt;
              -- the later exact-vector check validates those identities.
              DO $e2e_no_other_labels$
              BEGIN
                  IF EXISTS (
                      SELECT 1
                      FROM feature_log AS f
                      WHERE f.label IS NOT NULL
                        AND f.event_id NOT IN (
                            SELECT
                                md5('sentinel-e2e-corrupted-fixture-' || samples.n)::uuid
                            FROM generate_series(1, 1000) AS samples(n)
                        )
                  ) THEN
                      RAISE EXCEPTION
                          'Protection Test requires no other labeled rows in sentinel_e2e';
                  END IF;
              END;
              $e2e_no_other_labels$;

              -- Ten deterministic synthetic 28x28 patterns.
              -- Keep the feature vectors intact and shift only the labels:
              -- original class 0 -> label 1, ..., original class 9 -> label 0.
              WITH pixel_rows AS (
                  SELECT
                      label_id,
                      y,
                      jsonb_agg(
                          CASE
                              WHEN (x + label_id * 3 + y) % 13 < 3
                              THEN 1.0
                              ELSE 0.0
                          END
                          ORDER BY x
                      ) AS pixel_row
                  FROM generate_series(0, 9) AS labels(label_id)
                  CROSS JOIN generate_series(0, 27) AS ys(y)
                  CROSS JOIN generate_series(0, 27) AS xs(x)
                  GROUP BY label_id, y
              ),
              class_vectors AS (
                  SELECT
                      label_id,
                      jsonb_build_array(
                          jsonb_build_array(
                              jsonb_agg(pixel_row ORDER BY y)
                          )
                      ) AS vector
                  FROM pixel_rows
                  GROUP BY label_id
              )
              INSERT INTO feature_log (
                  event_id,
                  image_id,
                  timestamp,
                  raw_image,
                  vector,
                  label,
                  labeled_at,
                  model_version
              )
              SELECT
                  md5('sentinel-e2e-corrupted-fixture-' || samples.n)::uuid,
                  'e2e-corrupt-' || lpad(samples.n::text, 4, '0'),
                  CURRENT_TIMESTAMP - INTERVAL '2 minutes',
                  NULL,
                  class_vectors.vector,
                  (samples.n % 10)::text,
                  CURRENT_TIMESTAMP - INTERVAL '1 minute',
                  'e2e_corrupted'
              FROM generate_series(1, 1000) AS samples(n)
              JOIN class_vectors
                ON class_vectors.label_id = (samples.n - 1) % 10
              ON CONFLICT (event_id) DO NOTHING;

              -- Verify every reserved ID is present and matches the exact
              -- expected vector and deliberately shifted label.
              DO $e2e_corrupted_count$
              DECLARE
                  fixture_count INTEGER;
                  reserved_count INTEGER;
              BEGIN
                  WITH pixel_rows AS (
                      SELECT
                          label_id,
                          y,
                          jsonb_agg(
                              CASE
                                  WHEN (x + label_id * 3 + y) % 13 < 3
                                  THEN 1.0
                                  ELSE 0.0
                              END
                              ORDER BY x
                          ) AS pixel_row
                      FROM generate_series(0, 9) AS labels(label_id)
                      CROSS JOIN generate_series(0, 27) AS ys(y)
                      CROSS JOIN generate_series(0, 27) AS xs(x)
                      GROUP BY label_id, y
                  ),
                  class_vectors AS (
                      SELECT
                          label_id,
                          jsonb_build_array(
                              jsonb_build_array(
                                  jsonb_agg(pixel_row ORDER BY y)
                              )
                          ) AS vector
                      FROM pixel_rows
                      GROUP BY label_id
                  )
                  SELECT COUNT(*) INTO fixture_count
                  FROM feature_log AS f
                  JOIN generate_series(1, 1000) AS samples(n)
                    ON f.event_id =
                       md5('sentinel-e2e-corrupted-fixture-' || samples.n)::uuid
                   AND f.image_id =
                       'e2e-corrupt-' || lpad(samples.n::text, 4, '0')
                  JOIN class_vectors
                    ON class_vectors.label_id = (samples.n - 1) % 10
                  WHERE f.model_version = 'e2e_corrupted'
                    AND f.label = (samples.n % 10)::text
                    AND f.vector = class_vectors.vector
                    AND f.raw_image IS NULL
                    AND f.labeled_at IS NOT NULL
                    AND f.timestamp <= f.labeled_at;

                  SELECT COUNT(*) INTO reserved_count
                  FROM feature_log AS f
                  JOIN generate_series(1, 1000) AS samples(n)
                    ON f.event_id =
                       md5('sentinel-e2e-corrupted-fixture-' || samples.n)::uuid;

                  IF fixture_count <> 1000 OR reserved_count <> 1000 THEN
                      RAISE EXCEPTION
                          'Unexpected corrupted E2E fixtures: verified %, reserved %',
                          fixture_count, reserved_count;
                  END IF;

                  RAISE NOTICE
                      'E2E corrupted training fixtures verified: %',
                      fixture_count;
              END;
              $e2e_corrupted_count$;

              COMMIT;

              SQL

              echo "E2E corrupted seed completed successfully."
{{- end }}
