apiVersion: v1
kind: ServiceAccount

metadata:
  name: promtail
  labels:
    app.kubernetes.io/name: promtail
    app.kubernetes.io/component: log-collector
    app.kubernetes.io/part-of: sentinel

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole

metadata:
  name: "{{ .Release.Name }}-promtail"
  labels:
    app.kubernetes.io/name: promtail
    app.kubernetes.io/component: log-collector
    app.kubernetes.io/part-of: sentinel

rules:
  - apiGroups:
      - ""
    resources:
      - pods
    verbs:
      - get
      - list
      - watch

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding

metadata:
  name: "{{ .Release.Name }}-promtail"
  labels:
    app.kubernetes.io/name: promtail
    app.kubernetes.io/component: log-collector
    app.kubernetes.io/part-of: sentinel

roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: "{{ .Release.Name }}-promtail"

subjects:
  - kind: ServiceAccount
    name: promtail
    namespace: {{ .Release.Namespace | quote }}

---
apiVersion: v1
kind: ConfigMap

metadata:
  name: promtail-config
  labels:
    app.kubernetes.io/name: promtail
    app.kubernetes.io/component: log-collector
    app.kubernetes.io/part-of: sentinel

data:
  promtail.yaml: |
    server:
      http_listen_port: {{ .Values.promtail.serverPort }}
      grpc_listen_port: 0

    positions:
      filename: /var/lib/promtail/positions.yaml

    clients:
      - url: http://loki:{{ .Values.loki.service.port }}/loki/api/v1/push

    scrape_configs:
      - job_name: kubernetes-pods

        kubernetes_sd_configs:
          - role: pod

        pipeline_stages:
          - docker: {}

        relabel_configs:
          - source_labels:
              - __meta_kubernetes_pod_node_name
            target_label: __host__

          - source_labels:
              - __meta_kubernetes_namespace
            target_label: namespace

          - source_labels:
              - __meta_kubernetes_pod_name
            target_label: pod

          - source_labels:
              - __meta_kubernetes_pod_container_name
            target_label: container

          - source_labels:
              - __meta_kubernetes_pod_label_app_kubernetes_io_name
            target_label: app

          - source_labels:
              - __meta_kubernetes_pod_uid
              - __meta_kubernetes_pod_container_name
            separator: /
            replacement: /var/log/pods/*$1/$2/*.log
            target_label: __path__

---
apiVersion: apps/v1
kind: DaemonSet

metadata:
  name: promtail
  labels:
    app.kubernetes.io/name: promtail
    app.kubernetes.io/component: log-collector
    app.kubernetes.io/part-of: sentinel

spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: promtail

  template:
    metadata:
      labels:
        app.kubernetes.io/name: promtail
        app.kubernetes.io/component: log-collector
        app.kubernetes.io/part-of: sentinel

    spec:
      serviceAccountName: promtail

      containers:
        - name: promtail
          image: "{{ .Values.promtail.image.repository }}:{{ .Values.promtail.image.tag }}"
          imagePullPolicy: {{ .Values.promtail.image.pullPolicy }}

          env:
            - name: HOSTNAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName

          args:
            - "-config.file=/etc/promtail/promtail.yaml"

          volumeMounts:
            - name: config
              mountPath: /etc/promtail

            - name: varlog
              mountPath: /var/log
              readOnly: true

            - name: docker-containers
              mountPath: /var/lib/docker/containers
              readOnly: true

            - name: positions
              mountPath: /var/lib/promtail

      volumes:
        - name: config
          configMap:
            name: promtail-config

        - name: varlog
          hostPath:
            path: /var/log

        - name: docker-containers
          hostPath:
            path: /var/lib/docker/containers

        - name: positions
          hostPath:
            path: /var/lib/promtail
            type: DirectoryOrCreate