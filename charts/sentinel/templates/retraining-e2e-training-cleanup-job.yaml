
{{- $cleanup := .Values.retraining.e2eTrainingCleanup | default dict -}}
{{- if ($cleanup.enabled | default false) }}

{{- if ne .Release.Namespace "sentinel-dev" }}
{{- fail "E2E training cleanup is allowed only in sentinel-dev" }}
{{- end }}

{{- if ne .Values.retraining.pipelineName "sentinel-retraining-e2e" }}
{{- fail "E2E training cleanup requires the isolated pipeline" }}
{{- end }}

{{- if ne .Values.retraining.database.configMapName "sentinel-retraining-e2e-db" }}
{{- fail "E2E training cleanup requires the isolated database ConfigMap" }}
{{- end }}

{{- if ne .Values.retraining.database.credentialsSecretName "sentinel-retraining-e2e-db-credentials" }}
{{- fail "E2E training cleanup requires isolated database credentials" }}
{{- end }}

apiVersion: batch/v1
kind: Job

metadata:
  name: sentinel-e2e-training-cleanup
  labels:
    app.kubernetes.io/name: sentinel-e2e-training-cleanup
    app.kubernetes.io/component: retraining-e2e-test
    app.kubernetes.io/part-of: sentinel

spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 3600

  template:
    metadata:
      labels:
        app.kubernetes.io/name: sentinel-e2e-training-cleanup

    spec:
      restartPolicy: Never
      automountServiceAccountToken: false

      containers:
        - name: postgres-training-cleanup
          image: "{{ .Values.postgres.image.repository }}:{{ .Values.postgres.image.tag }}"
          imagePullPolicy: {{ .Values.postgres.image.pullPolicy }}

          env:
            - name: K8S_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace

            - name: POSTGRES_HOST
              valueFrom:
                configMapKeyRef:
                  name: sentinel-retraining-e2e-db
                  key: POSTGRES_HOST

            - name: POSTGRES_PORT
              valueFrom:
                configMapKeyRef:
                  name: sentinel-retraining-e2e-db
                  key: POSTGRES_PORT

            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: sentinel-retraining-e2e-db
                  key: POSTGRES_DB

            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: sentinel-retraining-e2e-db-credentials
                  key: POSTGRES_USER

            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: sentinel-retraining-e2e-db-credentials
                  key: POSTGRES_PASSWORD

          command:
            - sh
            - -c

          args:
            - |
              set -eu

              if [ "$K8S_NAMESPACE" != "sentinel-dev" ] ||
                 [ "$POSTGRES_DB" != "sentinel_e2e" ] ||
                 [ "$POSTGRES_USER" != "sentinel_e2e_user" ]; then
                  echo "ERROR: Invalid E2E training cleanup target." >&2
                  exit 1
              fi

              export PGPASSWORD="$POSTGRES_PASSWORD"

              psql -X -v ON_ERROR_STOP=1 \
                -h "$POSTGRES_HOST" \
                -p "$POSTGRES_PORT" \
                -U "$POSTGRES_USER" \
                -d "$POSTGRES_DB" <<'SQL'

              BEGIN;

              DO $e2e_training_cleanup$
              DECLARE
                  deleted_count INTEGER;
                  remaining_count INTEGER;
              BEGIN
                  IF current_database() <> 'sentinel_e2e'
                     OR current_user <> 'sentinel_e2e_user'
                  THEN
                      RAISE EXCEPTION
                          'E2E training cleanup identity verification failed';
                  END IF;

                  -- Reconstruct the exact deterministic fixture vectors.
                  WITH pixel_rows AS (
                      SELECT
                          label_id,
                          y,
                          jsonb_agg(
                              CASE
                                  WHEN (x + label_id * 3 + y) % 13 < 3
                                  THEN 1.0
                                  ELSE 0.0
                              END
                              ORDER BY x
                          ) AS pixel_row
                      FROM generate_series(0, 9) AS labels(label_id)
                      CROSS JOIN generate_series(0, 27) AS ys(y)
                      CROSS JOIN generate_series(0, 27) AS xs(x)
                      GROUP BY label_id, y
                  ),
                  class_vectors AS (
                      SELECT
                          label_id,
                          jsonb_build_array(
                              jsonb_build_array(
                                  jsonb_agg(pixel_row ORDER BY y)
                              )
                          ) AS vector
                      FROM pixel_rows
                      GROUP BY label_id
                  ),
                  deleted AS (
                      DELETE FROM feature_log AS f
                      USING
                          generate_series(1, 1000) AS samples(n),
                          class_vectors
                      WHERE f.event_id =
                            md5('sentinel-e2e-training-fixture-' || samples.n)::uuid
                        AND f.image_id =
                            'e2e-train-' || lpad(samples.n::text, 4, '0')
                        AND f.model_version = 'e2e_training'
                        AND f.label = ((samples.n - 1) % 10)::text
                        AND class_vectors.label_id = (samples.n - 1) % 10
                        AND f.vector = class_vectors.vector
                        AND f.raw_image IS NULL
                        AND f.labeled_at IS NOT NULL
                        AND f.timestamp <= f.labeled_at
                      RETURNING f.event_id
                  )
                  SELECT COUNT(*)
                  INTO deleted_count
                  FROM deleted;

                  IF deleted_count NOT IN (0, 1000) THEN
                      RAISE EXCEPTION
                          'Unexpected E2E training cleanup count: %',
                          deleted_count;
                  END IF;

                  -- Never report success if any fixture identity remains.
                  SELECT COUNT(*)
                  INTO remaining_count
                  FROM feature_log AS f
                  JOIN generate_series(1, 1000) AS samples(n)
                    ON f.event_id =
                       md5('sentinel-e2e-training-fixture-' || samples.n)::uuid;

                  IF remaining_count <> 0 THEN
                      RAISE EXCEPTION
                          'E2E training fixture identities remain: %',
                          remaining_count;
                  END IF;

                  RAISE NOTICE
                      'E2E training fixtures deleted: %',
                      deleted_count;
              END;
              $e2e_training_cleanup$;

              COMMIT;

              SQL

              echo "E2E training cleanup completed successfully."

{{- end }}
