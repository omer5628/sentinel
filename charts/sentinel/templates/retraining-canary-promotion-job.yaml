{{- if and .Values.retraining.enabled .Values.retraining.canaryPromotion.enabled }}

{{- $runId := required
    "retraining.runId is required for Canary promotion"
    .Values.retraining.runId
-}}
{{- if not (regexMatch "^[1-9][0-9]*$" (toString $runId)) }}
{{- fail "retraining.runId must be a positive integer for Canary promotion" }}
{{- end }}

{{- $promotion := .Values.retraining.canaryPromotion -}}
{{- $e2eSettings := get $promotion "e2eIsolation" | default dict -}}
{{- $e2eIsolation := get $e2eSettings "enabled" | default false -}}
{{- $servingTaskId := required
    "retraining.canaryPromotion.servingTaskId is required"
    $promotion.servingTaskId
-}}
{{- $candidate := required
    "retraining.canaryPromotion.candidateModelReference is required"
    $promotion.candidateModelReference
-}}
{{- $expectedPrevious := required
    "retraining.canaryPromotion.expectedPreviousCanaryModelReference is required"
    $promotion.expectedPreviousCanaryModelReference
-}}
{{- $production := required
    "model.productionReference is required for Canary promotion"
    .Values.model.productionReference
-}}
{{- $imageTag := required
    "retraining.canaryPromotion.image.tag is required"
    $promotion.image.tag
-}}
{{- $servingConfig := required
    "retraining.canaryPromotion.servingConfig is required"
    $promotion.servingConfig
-}}
{{- $inferenceBaseUrl := required
    "retraining.canaryPromotion.inferenceBaseUrl is required"
    $promotion.inferenceBaseUrl
-}}
{{- $smokeTestAttempts := int $promotion.smokeTestAttempts -}}
{{- if lt $smokeTestAttempts 1 }}
{{- fail "retraining.canaryPromotion.smokeTestAttempts must be positive" }}
{{- end }}
{{- $smokeTestRetrySeconds := float64 $promotion.smokeTestRetrySeconds -}}
{{- if lt $smokeTestRetrySeconds 0.0 }}
{{- fail "retraining.canaryPromotion.smokeTestRetrySeconds cannot be negative" }}
{{- end }}

{{- $apiHost := required
    "retraining.clearml.apiHost is required for Canary promotion"
    .Values.retraining.clearml.apiHost
-}}
{{- $filesHost := required
    "retraining.clearml.filesHost is required for Canary promotion"
    .Values.retraining.clearml.filesHost
-}}
{{- $webHost := required
    "retraining.clearml.webHost is required for Canary promotion"
    .Values.retraining.clearml.webHost
-}}

{{- if $e2eIsolation -}}
{{- if ne .Release.Namespace "sentinel-dev" -}}
{{- fail "E2E Canary promotion refused: unauthorized namespace" -}}
{{- end -}}
{{- if ne $servingTaskId "f80299ed1fb44353a347dafe47b7dd25" -}}
{{- fail "E2E Canary promotion refused: unauthorized Serving Task ID" -}}
{{- end -}}
{{- if ne $inferenceBaseUrl "http://clearml-serving-e2e-inference.sentinel-dev.svc.cluster.local:8080" -}}
{{- fail "E2E Canary promotion refused: unauthorized inference service" -}}
{{- end -}}
{{- if lt (int $runId) 3 -}}
{{- fail "E2E Canary promotion refused: Serving version is reserved" -}}
{{- end -}}
{{- end }}

apiVersion: batch/v1
kind: Job
metadata:
  name: "sentinel-retraining-canary-promotion-{{ $runId }}"
  labels:
    app.kubernetes.io/name: sentinel-retraining-canary-promotion
    app.kubernetes.io/component: retraining
    app.kubernetes.io/part-of: sentinel
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sentinel-retraining-canary-promotion
        app.kubernetes.io/component: retraining
        app.kubernetes.io/part-of: sentinel
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      {{- if .Values.registry.existingPullSecret }}
      imagePullSecrets:
        - name: {{ .Values.registry.existingPullSecret | quote }}
      {{- end }}
      containers:
        - name: canary-promotion
          image: "{{ $promotion.image.repository }}:{{ $imageTag }}"
          imagePullPolicy: {{ $promotion.image.pullPolicy }}
          command:
            - /bin/sh
            - -ec
          args:
            - |
              set -eu

              {{- if $e2eIsolation }}
              # Fail closed before any ClearML Serving mutation (including registration).
              python - <<'PY'
              import math
              import os
              import sys

              from omegaconf import OmegaConf

              sys.path.insert(0, "scripts")
              from promote_serving_canary import _model_id_at, read_serving_state

              task = os.environ["SERVING_TASK_ID"]
              url = os.environ["INFERENCE_BASE_URL"]
              if task != "f80299ed1fb44353a347dafe47b7dd25":
                  raise RuntimeError("Unauthorized E2E Serving Task ID")
              if url != "http://clearml-serving-e2e-inference.sentinel-dev.svc.cluster.local:8080":
                  raise RuntimeError("Unauthorized E2E inference endpoint")

              config = OmegaConf.load(os.environ["SERVING_CONFIG"])
              base = str(config.endpoints.base)
              canary = str(config.endpoints.canary)
              current = os.environ["PRODUCTION_MODEL_ID"].lower()
              previous = os.environ["EXPECTED_PREVIOUS_CANARY_MODEL_ID"].lower()
              candidate = os.environ["CANDIDATE_MODEL_ID"].lower()
              version = int(os.environ["SERVING_VERSION"])
              if version <= 2 or len({current, previous, candidate}) != 3:
                  raise RuntimeError("Invalid isolated E2E model IDs or Serving version")

              state = read_serving_state(task)
              base_route = f"{base}/1"
              previous_route = f"{base}/2"
              candidate_route = f"{base}/{version}"
              allowed_endpoints = {base_route, previous_route, candidate_route}
              if not {base_route, previous_route}.issubset(state.endpoints):
                  raise RuntimeError("Missing E2E base or previous Canary endpoint")
              if not set(state.endpoints).issubset(allowed_endpoints):
                  raise RuntimeError("Unexpected E2E Serving endpoint; refusing promotion")
              if _model_id_at(state, base_route) != current:
                  raise RuntimeError("E2E base model does not match expected baseline")
              if _model_id_at(state, previous_route) != previous:
                  raise RuntimeError("E2E previous Canary model differs from expected")
              if candidate_route in state.endpoints and _model_id_at(state, candidate_route) != candidate:
                  raise RuntimeError("E2E candidate Serving version belongs to another model")

              if set(state.canary) != {canary}:
                  raise RuntimeError("Unexpected E2E Canary routing keys")
              route = state.canary[canary]
              if not isinstance(route, dict) or route.get("load_endpoint_prefix") is not None:
                  raise RuntimeError("Unsupported E2E Canary route")
              if route.get("load_endpoints") != [base_route, previous_route]:
                  raise RuntimeError("E2E Canary endpoints changed before promotion")
              weights = route.get("weights")
              if not isinstance(weights, list) or len(weights) != 2 or any(
                  isinstance(value, bool) or not isinstance(value, (int, float))
                  or not math.isfinite(value)
                  or not math.isclose(float(value), target, abs_tol=1e-8, rel_tol=0)
                  for value, target in zip(weights, (0.9, 0.1))
              ):
                  raise RuntimeError("E2E Canary traffic weights differ from 90/10")
              print("E2E Canary isolation preflight passed")
              PY

              {{- end }}
              python scripts/register_serving_candidate.py \
                --config "$SERVING_CONFIG" \
                --serving-task-id "$SERVING_TASK_ID" \
                --candidate-model-id "$CANDIDATE_MODEL_ID" \
                --model-version "$MODEL_VERSION" \
                --serving-version "$SERVING_VERSION" \
                --execute

              # Do not route traffic until the new version answers inference.
              python scripts/verify_serving_inference.py \
                --config "$SERVING_CONFIG" \
                --inference-base-url "$INFERENCE_BASE_URL" \
                --serving-version "$SERVING_VERSION" \
                --model-version "$MODEL_VERSION" \
                --attempts "$SMOKE_TEST_ATTEMPTS" \
                --retry-seconds "$SMOKE_TEST_RETRY_SECONDS"

              # Fail closed if live Canary drifted from its Git reference.
              # An already-promoted candidate is allowed for a safe retry.
              python - <<'PY'
              import os
              import sys

              sys.path.insert(0, "scripts")
              from omegaconf import OmegaConf
              from promote_serving_canary import (
                  _model_id_at,
                  plan_canary_promotion,
                  read_serving_state,
              )

              cfg = OmegaConf.load(os.environ["SERVING_CONFIG"])
              task_id = os.environ["SERVING_TASK_ID"]
              production = os.environ["PRODUCTION_MODEL_ID"]
              candidate = os.environ["CANDIDATE_MODEL_ID"]
              expected_previous = os.environ["EXPECTED_PREVIOUS_CANARY_MODEL_ID"]
              state = read_serving_state(task_id)
              plan = plan_canary_promotion(
                  state=state,
                  task_id=task_id,
                  canary_endpoint=str(cfg.endpoints.canary),
                  base_endpoint=str(cfg.endpoints.base),
                  production_model_id=production,
                  candidate_model_id=candidate,
                  candidate_serving_version=int(os.environ["SERVING_VERSION"]),
              )
              if not plan.already_applied:
                  previous_index = 1 - plan.production_index
                  previous_id = _model_id_at(
                      state, plan.original_endpoints[previous_index]
                  )
                  if previous_id != expected_previous.lower():
                      raise RuntimeError(
                          "Live Canary model differs from Git; refusing promotion. "
                          f"Expected {expected_previous}, found {previous_id}."
                      )
              print("Canary/Git preflight consistency verified.")
              PY

              python scripts/promote_serving_canary.py \
                --config "$SERVING_CONFIG" \
                --serving-task-id "$SERVING_TASK_ID" \
                --production-model-id "$PRODUCTION_MODEL_ID" \
                --candidate-model-id "$CANDIDATE_MODEL_ID" \
                --serving-version "$SERVING_VERSION" \
                --execute

              {{- if $e2eIsolation }}
              # Verify the E2E Canary outcome independently of the generic promotion script.
              python - <<'PY'
              import math
              import os
              import sys

              from omegaconf import OmegaConf

              sys.path.insert(0, "scripts")
              from promote_serving_canary import _model_id_at, read_serving_state

              cfg = OmegaConf.load(os.environ["SERVING_CONFIG"])
              task = os.environ["SERVING_TASK_ID"]
              if task != "f80299ed1fb44353a347dafe47b7dd25":
                  raise RuntimeError("Unauthorized E2E task during final verification")
              state = read_serving_state(task)
              base_route = f"{cfg.endpoints.base}/1"
              candidate_route = f"{cfg.endpoints.base}/{os.environ['SERVING_VERSION']}"
              route_name = str(cfg.endpoints.canary)
              if set(state.canary) != {route_name}:
                  raise RuntimeError("Unexpected E2E Canary routing after promotion")
              route = state.canary[route_name]
              if route.get("load_endpoint_prefix") is not None or route.get("load_endpoints") != [
                  base_route, candidate_route
              ]:
                  raise RuntimeError("E2E Canary endpoint replacement was not verified")
              weights = route.get("weights")
              if not isinstance(weights, list) or len(weights) != 2 or any(
                  isinstance(w, bool) or not isinstance(w, (int, float))
                  or not math.isclose(float(w), expected, abs_tol=1e-8, rel_tol=0)
                  for w, expected in zip(weights, (0.9, 0.1))
              ):
                  raise RuntimeError("E2E traffic weights were changed")
              if (_model_id_at(state, base_route) != os.environ["PRODUCTION_MODEL_ID"].lower()
                  or _model_id_at(state, candidate_route) != os.environ["CANDIDATE_MODEL_ID"].lower()):
                  raise RuntimeError("Wrong models after E2E Canary promotion")
              print("e2e_canary_promotion_status=routing_verified")
              PY
              {{- end }}
              echo "canary_promotion_status=routing_verified"
          env:
            - name: SERVING_CONFIG
              value: {{ $servingConfig | quote }}
            - name: INFERENCE_BASE_URL
              value: {{ $inferenceBaseUrl | quote }}
            - name: SMOKE_TEST_ATTEMPTS
              value: {{ $smokeTestAttempts | quote }}
            - name: SMOKE_TEST_RETRY_SECONDS
              value: {{ $smokeTestRetrySeconds | quote }}
            - name: SERVING_TASK_ID
              value: {{ $servingTaskId | quote }}
            - name: PRODUCTION_MODEL_ID
              value: {{ $production | quote }}
            - name: CANDIDATE_MODEL_ID
              value: {{ $candidate | quote }}
            - name: EXPECTED_PREVIOUS_CANARY_MODEL_ID
              value: {{ $expectedPrevious | quote }}
            - name: MODEL_VERSION
              value: {{ printf "retrain-%s" (toString $runId) | quote }}
            - name: SERVING_VERSION
              value: {{ toString $runId | quote }}
            - name: CLEARML_API_HOST
              value: {{ $apiHost | quote }}
            - name: CLEARML_FILES_HOST
              value: {{ $filesHost | quote }}
            - name: CLEARML_WEB_HOST
              value: {{ $webHost | quote }}
            - name: CLEARML_API_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.retraining.clearml.existingSecret | quote }}
                  key: CLEARML_API_ACCESS_KEY
            - name: CLEARML_API_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.retraining.clearml.existingSecret | quote }}
                  key: CLEARML_API_SECRET_KEY
          resources:
            requests:
              cpu: {{ $promotion.resources.requests.cpu | quote }}
              memory: {{ $promotion.resources.requests.memory | quote }}
            limits:
              cpu: {{ $promotion.resources.limits.cpu | quote }}
              memory: {{ $promotion.resources.limits.memory | quote }}
{{- end }}
