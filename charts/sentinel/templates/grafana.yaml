apiVersion: v1
kind: ConfigMap

metadata:
  name: grafana-datasources
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/component: visualization
    app.kubernetes.io/part-of: sentinel

data:
  datasources.yaml: |
    apiVersion: 1

    prune: true

    datasources:
      - name: Prometheus
        uid: prometheus
        type: prometheus
        access: proxy
        url: {{ .Values.grafana.datasources.prometheusUrl }}
        isDefault: true
        editable: false

      - name: Loki
        uid: loki
        type: loki
        access: proxy
        url: {{ .Values.grafana.datasources.lokiUrl }}
        editable: false
        jsonData:
          derivedFields:
            - name: TraceID
              matcherRegex: '"trace_id"\s*:\s*"([a-fA-F0-9]+)"'
              datasourceUid: jaeger
              url: '$${__value.raw}'

      - name: Jaeger
        uid: jaeger
        type: jaeger
        access: proxy
        url: {{ .Values.grafana.datasources.jaegerUrl }}
        editable: false

---
apiVersion: v1
kind: ConfigMap

metadata:
  name: grafana-dashboard-provider
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/component: visualization
    app.kubernetes.io/part-of: sentinel

data:
  dashboards.yaml: |
    apiVersion: 1

    providers:
      - name: Sentinel
        orgId: 1
        folder: Sentinel
        type: file
        disableDeletion: false
        editable: true
        updateIntervalSeconds: 30
        options:
          path: /var/lib/grafana/dashboards

---
apiVersion: v1
kind: PersistentVolumeClaim

metadata:
  name: grafana-storage
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/component: visualization
    app.kubernetes.io/part-of: sentinel

spec:
  accessModes:
    - {{ .Values.grafana.persistence.accessMode }}

  resources:
    requests:
      storage: {{ .Values.grafana.persistence.size | quote }}

---
apiVersion: apps/v1
kind: Deployment

metadata:
  name: grafana
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/component: visualization
    app.kubernetes.io/part-of: sentinel

spec:
  replicas: {{ .Values.grafana.replicaCount }}

  selector:
    matchLabels:
      app.kubernetes.io/name: grafana

  template:
    metadata:
      labels:
        app.kubernetes.io/name: grafana
        app.kubernetes.io/component: visualization
        app.kubernetes.io/part-of: sentinel

    spec:
      containers:
        - name: grafana
          image: "{{ .Values.grafana.image.repository }}:{{ .Values.grafana.image.tag }}"
          imagePullPolicy: {{ .Values.grafana.image.pullPolicy }}

          ports:
            - name: http
              containerPort: {{ .Values.grafana.service.port }}

          env:
            - name: GF_SECURITY_ADMIN_USER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.grafana.admin.existingSecret | quote }}
                  key: {{ .Values.grafana.admin.userKey | quote }}

            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.grafana.admin.existingSecret | quote }}
                  key: {{ .Values.grafana.admin.passwordKey | quote }}

            - name: GF_SECURITY_CSRF_ADDITIONAL_HEADERS
              value: "X-Forwarded-Host"

          volumeMounts:
            - name: grafana-storage
              mountPath: /var/lib/grafana

            - name: grafana-datasources
              mountPath: /etc/grafana/provisioning/datasources
              readOnly: true

            - name: grafana-dashboard-provider
              mountPath: /etc/grafana/provisioning/dashboards
              readOnly: true

            - name: grafana-dashboards
              mountPath: /var/lib/grafana/dashboards
              readOnly: true

      volumes:
        - name: grafana-storage
          persistentVolumeClaim:
            claimName: grafana-storage

        - name: grafana-datasources
          configMap:
            name: grafana-datasources

        - name: grafana-dashboard-provider
          configMap:
            name: grafana-dashboard-provider

        - name: grafana-dashboards
          configMap:
            name: grafana-dashboards

---
apiVersion: v1
kind: Service

metadata:
  name: grafana
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/component: visualization
    app.kubernetes.io/part-of: sentinel

spec:
  type: {{ .Values.grafana.service.type }}

  selector:
    app.kubernetes.io/name: grafana

  ports:
    - name: http
      port: {{ .Values.grafana.service.port }}
      targetPort: http
      {{- if eq .Values.grafana.service.type "NodePort" }}
      nodePort: {{ .Values.grafana.service.nodePort }}
      {{- end }}