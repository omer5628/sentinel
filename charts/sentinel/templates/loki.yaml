apiVersion: v1
kind: ConfigMap

metadata:
  name: loki-config
  labels:
    app.kubernetes.io/name: loki
    app.kubernetes.io/component: logging
    app.kubernetes.io/part-of: sentinel

data:
  loki.yaml: |
    auth_enabled: false

    server:
      http_listen_port: {{ .Values.loki.service.port }}

    common:
      path_prefix: /loki
      replication_factor: 1
      ring:
        instance_addr: 127.0.0.1
        kvstore:
          store: inmemory

    schema_config:
      configs:
        - from: 2024-01-01
          store: tsdb
          object_store: filesystem
          schema: v13
          index:
            prefix: index_
            period: 24h

    storage_config:
      filesystem:
        directory: /loki/chunks

    compactor:
      working_directory: /loki/compactor

---
apiVersion: v1
kind: PersistentVolumeClaim

metadata:
  name: loki-storage
  labels:
    app.kubernetes.io/name: loki
    app.kubernetes.io/component: logging
    app.kubernetes.io/part-of: sentinel

spec:
  accessModes:
    - {{ .Values.loki.persistence.accessMode }}

  resources:
    requests:
      storage: {{ .Values.loki.persistence.size | quote }}

---
apiVersion: apps/v1
kind: StatefulSet

metadata:
  name: loki
  labels:
    app.kubernetes.io/name: loki
    app.kubernetes.io/component: logging
    app.kubernetes.io/part-of: sentinel

spec:
  serviceName: loki
  replicas: {{ .Values.loki.replicaCount }}

  selector:
    matchLabels:
      app.kubernetes.io/name: loki

  template:
    metadata:
      labels:
        app.kubernetes.io/name: loki
        app.kubernetes.io/component: logging
        app.kubernetes.io/part-of: sentinel

    spec:
      containers:
        - name: loki
          image: "{{ .Values.loki.image.repository }}:{{ .Values.loki.image.tag }}"
          imagePullPolicy: {{ .Values.loki.image.pullPolicy }}

          args:
            - "-config.file=/etc/loki/loki.yaml"

          ports:
            - name: http
              containerPort: {{ .Values.loki.service.port }}

          volumeMounts:
            - name: config
              mountPath: /etc/loki

            - name: storage
              mountPath: /loki

      volumes:
        - name: config
          configMap:
            name: loki-config

        - name: storage
          persistentVolumeClaim:
            claimName: loki-storage

---
apiVersion: v1
kind: Service

metadata:
  name: loki
  labels:
    app.kubernetes.io/name: loki
    app.kubernetes.io/component: logging
    app.kubernetes.io/part-of: sentinel

spec:
  type: {{ .Values.loki.service.type }}

  selector:
    app.kubernetes.io/name: loki

  ports:
    - name: http
      port: {{ .Values.loki.service.port }}
      targetPort: http