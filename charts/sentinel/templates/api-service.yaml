apiVersion: v1
kind: Service

metadata:
  name: sentinel-api
  labels:
    app.kubernetes.io/name: sentinel-api
    app.kubernetes.io/component: inference
    app.kubernetes.io/part-of: sentinel

spec:
  type: {{ .Values.api.service.type }}

  selector:
    app.kubernetes.io/name: sentinel-api

  ports:
    - name: http
      protocol: TCP
      port: {{ .Values.api.service.port }}
      targetPort: http