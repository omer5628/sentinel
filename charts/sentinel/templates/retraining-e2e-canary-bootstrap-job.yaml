{{- $bootstrap := .Values.retraining.e2eCanaryBootstrap | default dict -}}
{{- if $bootstrap.enabled }}
{{- $runId := required "retraining.runId is required for E2E Canary bootstrap" .Values.retraining.runId -}}
{{- if not (regexMatch "^[1-9][0-9]*$" (toString $runId)) -}}
{{- fail "E2E Canary bootstrap requires a positive numeric runId" -}}
{{- end -}}
{{- if ne .Values.retraining.pipelineName "sentinel-retraining-e2e" -}}
{{- fail "E2E Canary bootstrap requires sentinel-retraining-e2e configuration" -}}
{{- end -}}
{{- $promotion := .Values.retraining.canaryPromotion -}}
{{- if $promotion.enabled -}}
{{- fail "E2E Canary bootstrap must not enable normal Canary promotion" -}}
{{- end -}}
{{- $taskId := required "E2E Serving Task ID is required" $promotion.servingTaskId -}}
{{- if ne $taskId "f80299ed1fb44353a347dafe47b7dd25" -}}
{{- fail "E2E Canary bootstrap refused: unauthorized Serving Task ID" -}}
{{- end -}}
{{- $inferenceUrl := required "E2E inference URL is required" $promotion.inferenceBaseUrl -}}
{{- $base := required "E2E bootstrap base model reference is required" $bootstrap.baseModelReference -}}
{{- $previous := required "E2E bootstrap previous Canary model reference is required" $bootstrap.previousModelReference -}}
{{- if or (not (regexMatch "^[0-9a-f]{32}$" $taskId)) (not (regexMatch "^[0-9a-f]{32}$" $base)) (not (regexMatch "^[0-9a-f]{32}$" $previous)) (eq $base $previous) -}}
{{- fail "E2E Canary bootstrap requires distinct 32-character lowercase model IDs and a valid Task ID" -}}
{{- end -}}
{{- $baseServingVersion := int (required "E2E base serving version required" $bootstrap.baseServingVersion) -}}
{{- $previousServingVersion := int (required "E2E previous serving version required" $bootstrap.previousServingVersion) -}}
{{- if or (lt $baseServingVersion 1) (lt $previousServingVersion 1) (eq $baseServingVersion $previousServingVersion) -}}
{{- fail "E2E bootstrap requires distinct positive Serving versions" -}}
{{- end -}}
{{- $tag := required "An immutable E2E bootstrap image tag is required" $promotion.image.tag -}}
{{- if not (regexMatch "^[0-9]+$" (toString $tag)) -}}
{{- fail "E2E Canary bootstrap image tag must be numeric and immutable" -}}
{{- end -}}
{{- if not (hasPrefix "http://clearml-serving-e2e-inference." $inferenceUrl) -}}
{{- fail "E2E bootstrap must target the E2E inference deployment" -}}
{{- end -}}
{{- $servingConfig := required "E2E serving configuration is required" $promotion.servingConfig -}}
{{- $apiHost := required "ClearML API host is required" .Values.retraining.clearml.apiHost -}}
{{- $filesHost := required "ClearML files host is required" .Values.retraining.clearml.filesHost -}}
{{- $webHost := required "ClearML web host is required" .Values.retraining.clearml.webHost -}}
{{- $credentials := required "ClearML credentials secret is required" .Values.retraining.clearml.existingSecret -}}
apiVersion: batch/v1
kind: Job
metadata:
  name: "sentinel-e2e-canary-bootstrap-{{ $runId }}"
  labels:
    app.kubernetes.io/name: sentinel-e2e-canary-bootstrap
    app.kubernetes.io/component: retraining-e2e
    app.kubernetes.io/part-of: sentinel
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sentinel-e2e-canary-bootstrap
        app.kubernetes.io/component: retraining-e2e
        app.kubernetes.io/part-of: sentinel
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      {{- if .Values.registry.existingPullSecret }}
      imagePullSecrets:
        - name: {{ .Values.registry.existingPullSecret | quote }}
      {{- end }}
      containers:
        - name: e2e-canary-bootstrap
          image: "{{ $promotion.image.repository }}:{{ $tag }}"
          imagePullPolicy: {{ $promotion.image.pullPolicy }}
          command: ["/bin/sh", "-ec"]
          args:
            - |
              set -eu
              python - <<'PYCODE'
              import math
              import os
              import subprocess
              import sys

              from omegaconf import OmegaConf

              sys.path.insert(0, "scripts")
              from promote_serving_canary import SERVING_PREFIX, read_serving_state

              task_id = os.environ["SERVING_TASK_ID"]
              if task_id != "f80299ed1fb44353a347dafe47b7dd25":
                  raise RuntimeError("Unauthorized E2E Serving Task ID")
              if os.environ["INFERENCE_BASE_URL"] != (
                  "http://clearml-serving-e2e-inference.sentinel-dev.svc.cluster.local:8080"
              ):
                  raise RuntimeError("Unauthorized E2E inference endpoint")
              base_model = os.environ["BASE_MODEL_ID"]
              previous_model = os.environ["PREVIOUS_CANARY_MODEL_ID"]
              cfg_path = os.environ["SERVING_CONFIG"]
              cfg = OmegaConf.load(cfg_path)
              base_endpoint = str(cfg.endpoints.base)
              canary_endpoint = str(cfg.endpoints.canary)
              base_version = int(os.environ["BASE_SERVING_VERSION"])
              previous_version = int(os.environ["PREVIOUS_SERVING_VERSION"])
              desired_route = [f"{base_endpoint}/{base_version}", f"{base_endpoint}/{previous_version}"]
              desired_weights = [float(os.environ["BASE_WEIGHT"]), float(os.environ["PREVIOUS_WEIGHT"])]
              if (base_version < 1 or previous_version < 1 or base_version == previous_version
                  or any(not math.isfinite(w) or w < 0 for w in desired_weights)
                  or not math.isclose(sum(desired_weights), 1.0, abs_tol=1e-8, rel_tol=0)):
                  raise RuntimeError("Invalid E2E bootstrap Serving versions or traffic weights")
              expected_endpoints = {
                  desired_route[0]: base_model,
                  desired_route[1]: previous_model,
              }

              def assert_registered_matches(state):
                  if not set(state.endpoints).issubset(expected_endpoints):
                      raise RuntimeError("Unexpected Serving endpoint: refusing E2E bootstrap")
                  for endpoint, info in state.endpoints.items():
                      if not isinstance(info, dict) or str(info.get("model_id", "")).lower() != expected_endpoints[endpoint]:
                          raise RuntimeError(f"Existing endpoint has wrong model: {endpoint}")

              def verify_route(state):
                  if set(state.endpoints) != set(expected_endpoints):
                      raise RuntimeError("Missing or unexpected endpoint in E2E bootstrap")
                  assert_registered_matches(state)
                  if set(state.canary) != {canary_endpoint}:
                      raise RuntimeError("Unexpected Canary routing in E2E Serving Task")
                  route = state.canary[canary_endpoint]
                  if not isinstance(route, dict) or route.get("load_endpoint_prefix") is not None:
                      raise RuntimeError("Unsupported Canary routing configuration")
                  if route.get("load_endpoints") != desired_route:
                      raise RuntimeError("E2E Canary routing endpoints differ from expected")
                  weights = route.get("weights")
                  if not isinstance(weights, list) or len(weights) != 2 or any(
                      isinstance(w, bool) or not isinstance(w, (float, int))
                      or not math.isfinite(w)
                      or not math.isclose(w, expected, abs_tol=1e-8, rel_tol=0)
                      for w, expected in zip(weights, desired_weights)
                  ):
                      raise RuntimeError("Unexpected Canary routing weights")

              state = read_serving_state(task_id)
              assert_registered_matches(state)
              if state.canary:
                  verify_route(state)
                  print("e2e_canary_bootstrap_status=already_initialized")
                  sys.exit(0)

              # Existing versions may come from an interrupted run; the registration
              # adapter refuses to overwrite a version holding a different model.
              for model_id, version, model_version in (
                  (base_model, base_version, f"e2e-base-{base_version}"),
                  (previous_model, previous_version, f"e2e-previous-{previous_version}"),
              ):
                  subprocess.run([
                      sys.executable, "scripts/register_serving_candidate.py",
                      "--config", cfg_path,
                      "--serving-task-id", task_id,
                      "--candidate-model-id", model_id,
                      "--model-version", model_version,
                      "--serving-version", str(version),
                      "--execute",
                  ], check=True)

              state = read_serving_state(task_id)
              assert_registered_matches(state)
              if set(state.endpoints) != set(expected_endpoints) or state.canary:
                  raise RuntimeError("Serving state changed unexpectedly during bootstrap")

              # Validate both direct endpoints BEFORE exposing the initial Canary route.
              for version, model_version in (
                  (base_version, f"e2e-base-{base_version}"),
                  (previous_version, f"e2e-previous-{previous_version}"),
              ):
                  subprocess.run([
                      sys.executable, "scripts/verify_serving_inference.py",
                      "--config", cfg_path,
                      "--inference-base-url", os.environ["INFERENCE_BASE_URL"],
                      "--serving-version", str(version),
                      "--model-version", model_version,
                      "--attempts", os.environ["SMOKE_TEST_ATTEMPTS"],
                      "--retry-seconds", os.environ["SMOKE_TEST_RETRY_SECONDS"],
                  ], check=True)

              if read_serving_state(task_id) != state:
                  raise RuntimeError("Serving state changed before initial route creation")

              subprocess.run([
                  *SERVING_PREFIX, "--id", task_id, "model", "canary",
                  "--endpoint", canary_endpoint,
                  "--weights", *(str(weight) for weight in desired_weights),
                  "--input-endpoints", *desired_route,
              ], check=True)
              verify_route(read_serving_state(task_id))
              print("e2e_canary_bootstrap_status=initialized")
              PYCODE
          env:
            - name: SERVING_TASK_ID
              value: {{ $taskId | quote }}
            - name: SERVING_CONFIG
              value: {{ $servingConfig | quote }}
            - name: INFERENCE_BASE_URL
              value: {{ $inferenceUrl | quote }}
            - name: SMOKE_TEST_ATTEMPTS
              value: {{ int $promotion.smokeTestAttempts | quote }}
            - name: SMOKE_TEST_RETRY_SECONDS
              value: {{ $promotion.smokeTestRetrySeconds | quote }}
            - name: BASE_SERVING_VERSION
              value: {{ $baseServingVersion | quote }}
            - name: PREVIOUS_SERVING_VERSION
              value: {{ $previousServingVersion | quote }}
            - name: BASE_WEIGHT
              value: {{ $bootstrap.baseWeight | quote }}
            - name: PREVIOUS_WEIGHT
              value: {{ $bootstrap.previousWeight | quote }}
            - name: BASE_MODEL_ID
              value: {{ $base | quote }}
            - name: PREVIOUS_CANARY_MODEL_ID
              value: {{ $previous | quote }}
            - name: CLEARML_API_HOST
              value: {{ $apiHost | quote }}
            - name: CLEARML_FILES_HOST
              value: {{ $filesHost | quote }}
            - name: CLEARML_WEB_HOST
              value: {{ $webHost | quote }}
            - name: CLEARML_API_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ $credentials | quote }}
                  key: CLEARML_API_ACCESS_KEY
            - name: CLEARML_API_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ $credentials | quote }}
                  key: CLEARML_API_SECRET_KEY
          resources:
            requests:
              cpu: {{ $promotion.resources.requests.cpu | quote }}
              memory: {{ $promotion.resources.requests.memory | quote }}
            limits:
              cpu: {{ $promotion.resources.limits.cpu | quote }}
              memory: {{ $promotion.resources.limits.memory | quote }}
{{- end }}
