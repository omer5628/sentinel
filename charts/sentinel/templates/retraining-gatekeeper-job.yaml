{{- if and .Values.retraining.enabled .Values.retraining.gatekeeper.enabled }}

{{- $runId := required
    "retraining.runId is required when gatekeeper is enabled"
    .Values.retraining.runId
-}}

{{- $currentModelReference := required
    "retraining.gatekeeper.currentModelReference is required when gatekeeper is enabled"
    .Values.retraining.gatekeeper.currentModelReference
-}}

{{- $candidateModelReference := required
    "retraining.gatekeeper.candidateModelReference is required when gatekeeper is enabled"
    .Values.retraining.gatekeeper.candidateModelReference
-}}

{{- $gatekeeperTag := required
    "retraining.gatekeeper.image.tag is required when gatekeeper is enabled"
    .Values.retraining.gatekeeper.image.tag
-}}

{{- $clearmlApiHost := required
    "retraining.clearml.apiHost is required when gatekeeper is enabled"
    .Values.retraining.clearml.apiHost
-}}

{{- $clearmlFilesHost := required
    "retraining.clearml.filesHost is required when gatekeeper is enabled"
    .Values.retraining.clearml.filesHost
-}}

{{- $clearmlWebHost := required
    "retraining.clearml.webHost is required when gatekeeper is enabled"
    .Values.retraining.clearml.webHost
-}}

{{- $e2eProfile := default "" .Values.retraining.gatekeeper.e2eProfile -}}
{{- if $e2eProfile }}
  {{- if ne $e2eProfile "e2e_pass" }}
    {{- fail "Unsupported Gatekeeper E2E profile" }}
  {{- end }}
  {{- if ne .Release.Namespace "sentinel-dev" }}
    {{- fail "Gatekeeper E2E profile is restricted to sentinel-dev" }}
  {{- end }}
  {{- if ne (default "" .Values.retraining.pipelineName) "sentinel-retraining-e2e" }}
    {{- fail "Gatekeeper E2E profile requires the isolated retraining pipeline values" }}
  {{- end }}
{{- end }}

apiVersion: batch/v1
kind: Job

metadata:
  name: "sentinel-retraining-gatekeeper-{{ $runId }}"
  labels:
    app.kubernetes.io/name: sentinel-retraining-gatekeeper
    app.kubernetes.io/component: retraining
    app.kubernetes.io/part-of: sentinel

spec:
  backoffLimit: 0

  template:
    metadata:
      labels:
        app.kubernetes.io/name: sentinel-retraining-gatekeeper
        app.kubernetes.io/component: retraining
        app.kubernetes.io/part-of: sentinel

    spec:
      restartPolicy: Never
      automountServiceAccountToken: false

      {{- if .Values.registry.existingPullSecret }}
      imagePullSecrets:
        - name: {{ .Values.registry.existingPullSecret | quote }}
      {{- end }}

      containers:
        - name: retraining-gatekeeper
          image: "{{ .Values.retraining.gatekeeper.image.repository }}:{{ $gatekeeperTag }}"
          imagePullPolicy: {{ .Values.retraining.gatekeeper.image.pullPolicy }}

          command:
            - python
            - -m
            - sentinel.gatekeeper.compare

          args:
            - --current-model-reference
            - {{ $currentModelReference | quote }}
            - --candidate-model-reference
            - {{ $candidateModelReference | quote }}

          env:
            {{- if $e2eProfile }}
            - name: SENTINEL_GATEKEEPER_PROFILE
              value: {{ $e2eProfile | quote }}
            - name: SENTINEL_E2E_ONLY
              value: "true"
            {{- end }}
            - name: CLEARML_API_HOST
              value: {{ $clearmlApiHost | quote }}

            - name: CLEARML_FILES_HOST
              value: {{ $clearmlFilesHost | quote }}

            - name: CLEARML_WEB_HOST
              value: {{ $clearmlWebHost | quote }}

            - name: CLEARML_API_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.retraining.clearml.existingSecret | quote }}
                  key: CLEARML_API_ACCESS_KEY

            - name: CLEARML_API_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.retraining.clearml.existingSecret | quote }}
                  key: CLEARML_API_SECRET_KEY

          resources:
            requests:
              cpu: {{ .Values.retraining.gatekeeper.resources.requests.cpu | quote }}
              memory: {{ .Values.retraining.gatekeeper.resources.requests.memory | quote }}
            limits:
              cpu: {{ .Values.retraining.gatekeeper.resources.limits.cpu | quote }}
              memory: {{ .Values.retraining.gatekeeper.resources.limits.memory | quote }}

{{- end }}
