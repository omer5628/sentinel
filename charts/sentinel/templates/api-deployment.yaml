apiVersion: apps/v1
kind: Deployment

metadata:
  name: sentinel-api
  labels:
    app.kubernetes.io/name: sentinel-api
    app.kubernetes.io/component: inference
    app.kubernetes.io/part-of: sentinel

spec:
  replicas: {{ .Values.api.replicaCount }}
  revisionHistoryLimit: 3
  progressDeadlineSeconds: 180

  selector:
    matchLabels:
      app.kubernetes.io/name: sentinel-api

  template:
    metadata:
      labels:
        app.kubernetes.io/name: sentinel-api
        app.kubernetes.io/component: inference
        app.kubernetes.io/part-of: sentinel

    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: type
                    operator: In
                    values:
                      - {{ .Values.api.nodeAffinity.type | quote }}

      imagePullSecrets:
        - name: {{ .Values.registry.existingPullSecret | quote }}

      containers:
        - name: api
          image: "{{ .Values.api.image.repository }}:{{ .Values.api.image.tag }}"
          imagePullPolicy: {{ .Values.api.image.pullPolicy }}

          ports:
            - name: http
              containerPort: {{ .Values.api.service.port }}
              protocol: TCP

          env:
            - name: LOG_LEVEL
              valueFrom:
                configMapKeyRef:
                  name: sentinel-common-config
                  key: LOG_LEVEL

            - name: REDIS_HOST
              valueFrom:
                configMapKeyRef:
                  name: sentinel-common-config
                  key: REDIS_HOST

            - name: REDIS_PORT
              valueFrom:
                configMapKeyRef:
                  name: sentinel-common-config
                  key: REDIS_PORT

            - name: TRITON_GRPC_URL
              value: {{ .Values.api.triton.grpcUrl | quote }}

            - name: TRITON_MODEL_NAME
              value: {{ .Values.api.triton.modelName | quote }}

            - name: TRITON_MODEL_VERSION
              value: {{ .Values.api.triton.modelVersion | quote }}

          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            successThreshold: 1
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /live
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 3
            successThreshold: 1
            failureThreshold: 3

          resources:
            requests:
              cpu: {{ .Values.api.resources.requests.cpu | quote }}
              memory: {{ .Values.api.resources.requests.memory | quote }}
            limits:
              cpu: {{ .Values.api.resources.limits.cpu | quote }}
              memory: {{ .Values.api.resources.limits.memory | quote }}