apiVersion: v1
kind: ConfigMap

metadata:
  name: prometheus-config
  labels:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/component: metrics
    app.kubernetes.io/part-of: sentinel

data:
  prometheus.yml: |
    global:
      scrape_interval: {{ .Values.prometheus.scrapeInterval }}

    {{- if .Values.alertmanager.enabled }}

    alerting:
      alertmanagers:
        - static_configs:
            - targets:
                - "alertmanager:{{ .Values.alertmanager.service.port }}"
    {{- end }}

    {{- if .Values.driftDetection.enabled }}

    rule_files:
      - /etc/prometheus/rules/*.yml
    {{- end }}

    scrape_configs:
      - job_name: "sentinel-api"
        metrics_path: {{ .Values.prometheus.target.metricsPath }}
        static_configs:
          - targets:
              - "{{ .Values.prometheus.target.service }}:{{ .Values.prometheus.target.port }}"

---
apiVersion: apps/v1
kind: Deployment

metadata:
  name: prometheus
  labels:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/component: metrics
    app.kubernetes.io/part-of: sentinel

spec:
  replicas: {{ .Values.prometheus.replicaCount }}

  selector:
    matchLabels:
      app.kubernetes.io/name: prometheus

  template:
    metadata:
      labels:
        app.kubernetes.io/name: prometheus
        app.kubernetes.io/component: metrics
        app.kubernetes.io/part-of: sentinel

      annotations:
        sentinel.io/prometheus-config-checksum: {{ printf "%v|%s|%v|%v|%s|%v|%s|%v|%s" .Values.driftDetection.enabled .Values.driftDetection.window .Values.driftDetection.minimumPredictions .Values.driftDetection.predictionDistribution.maxClassShare .Values.driftDetection.alertFor .Values.alertmanager.enabled .Values.prometheus.target.service .Values.prometheus.target.port .Values.prometheus.target.metricsPath | sha256sum | quote }}

    spec:
      containers:
        - name: prometheus
          image: "{{ .Values.prometheus.image.repository }}:{{ .Values.prometheus.image.tag }}"
          imagePullPolicy: {{ .Values.prometheus.image.pullPolicy }}

          args:
            - "--config.file=/etc/prometheus/prometheus.yml"

          ports:
            - name: http
              containerPort: {{ .Values.prometheus.service.port }}

          volumeMounts:
            - name: prometheus-config
              mountPath: /etc/prometheus/prometheus.yml
              subPath: prometheus.yml

            {{- if .Values.driftDetection.enabled }}
            - name: prometheus-drift-rules
              mountPath: /etc/prometheus/rules
              readOnly: true
            {{- end }}

      volumes:
        - name: prometheus-config
          configMap:
            name: prometheus-config

        {{- if .Values.driftDetection.enabled }}
        - name: prometheus-drift-rules
          configMap:
            name: prometheus-drift-rules
        {{- end }}

---
apiVersion: v1
kind: Service

metadata:
  name: prometheus
  labels:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/component: metrics
    app.kubernetes.io/part-of: sentinel

spec:
  type: {{ .Values.prometheus.service.type }}

  selector:
    app.kubernetes.io/name: prometheus

  ports:
    - name: http
      port: {{ .Values.prometheus.service.port }}
      targetPort: http
      {{- if eq .Values.prometheus.service.type "NodePort" }}
      nodePort: {{ .Values.prometheus.service.nodePort }}
      {{- end }}