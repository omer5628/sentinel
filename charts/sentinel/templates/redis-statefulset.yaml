apiVersion: v1
kind: Service

metadata:
  name: redis-headless
  labels:
    app.kubernetes.io/name: redis
    app.kubernetes.io/component: online-feature-store
    app.kubernetes.io/part-of: sentinel

spec:
  clusterIP: None

  selector:
    app.kubernetes.io/name: redis

  ports:
    - name: redis
      port: {{ .Values.redis.port }}
      targetPort: redis

---
apiVersion: apps/v1
kind: StatefulSet

metadata:
  name: redis
  labels:
    app.kubernetes.io/name: redis
    app.kubernetes.io/component: online-feature-store
    app.kubernetes.io/part-of: sentinel

spec:
  serviceName: redis-headless
  replicas: {{ .Values.redis.replicaCount }}

  selector:
    matchLabels:
      app.kubernetes.io/name: redis

  template:
    metadata:
      labels:
        app.kubernetes.io/name: redis
        app.kubernetes.io/component: online-feature-store
        app.kubernetes.io/part-of: sentinel

    spec:
      containers:
        - name: redis
          image: "{{ .Values.redis.image.repository }}:{{ .Values.redis.image.tag }}"
          imagePullPolicy: {{ .Values.redis.image.pullPolicy }}

          command:
            - redis-server

          args:
            - --appendonly
            - "yes"
            - --appendfsync
            - everysec
            - --dir
            - /data

          ports:
            - name: redis
              containerPort: {{ .Values.redis.port }}

          readinessProbe:
            exec:
              command:
                - redis-cli
                - ping
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6

          livenessProbe:
            exec:
              command:
                - redis-cli
                - ping
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6

          resources:
            requests:
              cpu: {{ .Values.redis.resources.requests.cpu | quote }}
              memory: {{ .Values.redis.resources.requests.memory | quote }}
            limits:
              cpu: {{ .Values.redis.resources.limits.cpu | quote }}
              memory: {{ .Values.redis.resources.limits.memory | quote }}

          volumeMounts:
            - name: redis-data
              mountPath: /data

  volumeClaimTemplates:
    - metadata:
        name: redis-data

      spec:
        accessModes:
          - {{ .Values.redis.persistence.accessMode }}

        resources:
          requests:
            storage: {{ .Values.redis.persistence.size | quote }}