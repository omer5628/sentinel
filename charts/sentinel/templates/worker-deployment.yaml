apiVersion: apps/v1
kind: Deployment

metadata:
  name: sentinel-worker
  labels:
    app.kubernetes.io/name: sentinel-worker
    app.kubernetes.io/component: ingestion
    app.kubernetes.io/part-of: sentinel

spec:
  replicas: {{ .Values.worker.replicaCount }}

  selector:
    matchLabels:
      app.kubernetes.io/name: sentinel-worker

  template:
    metadata:
      labels:
        app.kubernetes.io/name: sentinel-worker
        app.kubernetes.io/component: ingestion
        app.kubernetes.io/part-of: sentinel

    spec:
      {{- if .Values.registry.existingPullSecret }}
      imagePullSecrets:
        - name: {{ .Values.registry.existingPullSecret | quote }}
      {{- end }}

      containers:
        - name: worker
          image: "{{ .Values.worker.image.repository }}:{{ .Values.worker.image.tag }}"
          imagePullPolicy: {{ .Values.worker.image.pullPolicy }}

          env:
            - name: LOG_LEVEL
              valueFrom:
                configMapKeyRef:
                  name: sentinel-common-config
                  key: LOG_LEVEL

            - name: AUTO_INFERENCE_ENABLED
              value: {{ .Values.worker.autoInference.enabled | quote }}

            # Worker runtime configuration
            - name: WORKER_QUEUE_NAME
              value: {{ .Values.worker.runtime.queueName | quote }}

            - name: WORKER_DEAD_LETTER_EXCHANGE
              value: {{ .Values.worker.runtime.deadLetterExchange | quote }}

            - name: WORKER_DEAD_LETTER_QUEUE
              value: {{ .Values.worker.runtime.deadLetterQueue | quote }}

            - name: WORKER_DEAD_LETTER_ROUTING_KEY
              value: {{ .Values.worker.runtime.deadLetterRoutingKey | quote }}

            - name: WORKER_FEATURE_TTL_SECONDS
              value: {{ .Values.worker.runtime.featureTtlSeconds | quote }}

            - name: WORKER_PREFETCH_COUNT
              value: {{ .Values.worker.runtime.prefetchCount | quote }}

            - name: WORKER_RABBITMQ_HEARTBEAT
              value: {{ .Values.worker.runtime.rabbitmqHeartbeat | quote }}

            - name: WORKER_RABBITMQ_BLOCKED_TIMEOUT
              value: {{ .Values.worker.runtime.rabbitmqBlockedTimeout | quote }}

            # RabbitMQ connection
            - name: RABBITMQ_HOST
              valueFrom:
                configMapKeyRef:
                  name: sentinel-common-config
                  key: RABBITMQ_HOST

            - name: RABBITMQ_PORT
              valueFrom:
                configMapKeyRef:
                  name: sentinel-common-config
                  key: RABBITMQ_PORT

            # Redis connection
            - name: REDIS_HOST
              valueFrom:
                configMapKeyRef:
                  name: sentinel-common-config
                  key: REDIS_HOST

            - name: REDIS_PORT
              valueFrom:
                configMapKeyRef:
                  name: sentinel-common-config
                  key: REDIS_PORT

            # PostgreSQL connection
            - name: POSTGRES_HOST
              valueFrom:
                configMapKeyRef:
                  name: sentinel-common-config
                  key: POSTGRES_HOST

            - name: POSTGRES_PORT
              valueFrom:
                configMapKeyRef:
                  name: sentinel-common-config
                  key: POSTGRES_PORT

            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: sentinel-common-config
                  key: POSTGRES_DB

            # Credentials from Kubernetes Secrets
            - name: RABBITMQ_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.existingSecret | quote }}
                  key: RABBITMQ_USERNAME

            - name: RABBITMQ_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.existingSecret | quote }}
                  key: RABBITMQ_PASSWORD

            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.existingSecret | quote }}
                  key: POSTGRES_USER

            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.existingSecret | quote }}
                  key: POSTGRES_PASSWORD

          resources:
            requests:
              cpu: {{ .Values.worker.resources.requests.cpu | quote }}
              memory: {{ .Values.worker.resources.requests.memory | quote }}
            limits:
              cpu: {{ .Values.worker.resources.limits.cpu | quote }}
              memory: {{ .Values.worker.resources.limits.memory | quote }}