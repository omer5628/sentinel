{{- $cleanup := .Values.retraining.e2eDataCleanup | default dict -}}
{{- if ($cleanup.enabled | default false) }}

{{- if ne .Release.Namespace "sentinel-dev" }}
{{- fail "E2E cleanup is allowed only in sentinel-dev" }}
{{- end }}

{{- if ne .Values.retraining.pipelineName "sentinel-retraining-e2e" }}
{{- fail "E2E cleanup requires the isolated retraining pipeline" }}
{{- end }}

{{- if ne .Values.retraining.database.configMapName "sentinel-retraining-e2e-db" }}
{{- fail "E2E cleanup requires isolated database configuration" }}
{{- end }}

{{- if ne .Values.retraining.database.credentialsSecretName "sentinel-retraining-e2e-db-credentials" }}
{{- fail "E2E cleanup requires isolated database credentials" }}
{{- end }}

apiVersion: batch/v1
kind: Job

metadata:
  name: sentinel-e2e-data-gate-cleanup
  labels:
    app.kubernetes.io/name: sentinel-e2e-data-gate-cleanup
    app.kubernetes.io/component: retraining-e2e-test
    app.kubernetes.io/part-of: sentinel

spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 3600

  template:
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false

      containers:
        - name: postgres-cleanup
          image: "{{ .Values.postgres.image.repository }}:{{ .Values.postgres.image.tag }}"
          imagePullPolicy: {{ .Values.postgres.image.pullPolicy }}

          env:
            - name: K8S_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace

            - name: POSTGRES_HOST
              valueFrom:
                configMapKeyRef:
                  name: "sentinel-retraining-e2e-db"
                  key: POSTGRES_HOST

            - name: POSTGRES_PORT
              valueFrom:
                configMapKeyRef:
                  name: "sentinel-retraining-e2e-db"
                  key: POSTGRES_PORT

            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: "sentinel-retraining-e2e-db"
                  key: POSTGRES_DB

            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: "sentinel-retraining-e2e-db-credentials"
                  key: POSTGRES_USER

            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: "sentinel-retraining-e2e-db-credentials"
                  key: POSTGRES_PASSWORD

          command:
            - sh
            - -c

          args:
            - |
              set -eu

              if [ "$K8S_NAMESPACE" != "sentinel-dev" ] ||
                 [ "$POSTGRES_DB" != "sentinel_e2e" ] ||
                 [ "$POSTGRES_USER" != "sentinel_e2e_user" ]; then
                  echo "ERROR: Invalid E2E cleanup target." >&2
                  exit 1
              fi

              export PGPASSWORD="$POSTGRES_PASSWORD"

              psql -X -v ON_ERROR_STOP=1 \
                -h "$POSTGRES_HOST" \
                -p "$POSTGRES_PORT" \
                -U "$POSTGRES_USER" \
                -d "$POSTGRES_DB" <<'SQL'

              BEGIN;

              DO $e2e_cleanup$
              DECLARE
                  deleted_count INTEGER;
              BEGIN
                  IF current_database() <> 'sentinel_e2e'
                     OR current_user <> 'sentinel_e2e_user'
                  THEN
                      RAISE EXCEPTION
                          'E2E cleanup identity verification failed';
                  END IF;

                  DELETE FROM feature_log AS f
                  WHERE EXISTS (
                      SELECT 1
                      FROM generate_series(1, 1000) AS n
                      WHERE f.event_id =
                            md5('sentinel-e2e-gate-fixture-' || n)::uuid
                        AND f.image_id =
                            'e2e-gate-' || lpad(n::text, 4, '0')
                  )
                    AND f.model_version = 'e2e_fixture'
                    AND f.label = 'E2E_FIXTURE'
                    AND f.vector = '{"e2e_fixture": true}'::jsonb
                    AND f.raw_image IS NULL;

                  GET DIAGNOSTICS deleted_count = ROW_COUNT;

                  IF deleted_count NOT IN (0, 1000) THEN
                      RAISE EXCEPTION
                          'Unexpected cleanup count: %',
                          deleted_count;
                  END IF;

                  RAISE NOTICE
                      'E2E fixtures deleted: %',
                      deleted_count;
              END;
              $e2e_cleanup$;

              COMMIT;

              SQL

              echo "E2E data cleanup completed successfully."

{{- end }}