{{- $bootstrap := .Values.retraining.databaseBootstrap | default dict -}}
{{- if ($bootstrap.enabled | default false) }}

{{- if ne .Release.Namespace "sentinel-dev" }}
{{- fail "E2E database bootstrap is allowed only in sentinel-dev" }}
{{- end }}

{{- $databaseName := required
    "retraining.databaseBootstrap.databaseName is required"
    $bootstrap.databaseName
-}}

{{- $username := required
    "retraining.databaseBootstrap.username is required"
    $bootstrap.username
-}}

{{- if ne $databaseName "sentinel_e2e" }}
{{- fail "E2E database bootstrap must target sentinel_e2e" }}
{{- end }}

{{- if ne $username "sentinel_e2e_user" }}
{{- fail "E2E database bootstrap must use sentinel_e2e_user" }}
{{- end }}

apiVersion: batch/v1
kind: Job

metadata:
  name: sentinel-e2e-db-bootstrap
  labels:
    app.kubernetes.io/name: sentinel-e2e-db-bootstrap
    app.kubernetes.io/component: database-bootstrap
    app.kubernetes.io/part-of: sentinel

spec:
  backoffLimit: 0

  template:
    metadata:
      labels:
        app.kubernetes.io/name: sentinel-e2e-db-bootstrap

    spec:
      restartPolicy: Never
      automountServiceAccountToken: false

      containers:
        - name: postgres-bootstrap
          image: "{{ .Values.postgres.image.repository }}:{{ .Values.postgres.image.tag }}"
          imagePullPolicy: {{ .Values.postgres.image.pullPolicy }}

          env:
            - name: K8S_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace

            - name: POSTGRES_HOST
              value: "postgres-0.postgres-headless.sentinel-dev.svc.cluster.local"

            - name: POSTGRES_PORT
              value: {{ .Values.postgres.port | quote }}

            - name: POSTGRES_ADMIN_USER
              valueFrom:
                secretKeyRef:
                  name: {{ $bootstrap.adminCredentialsSecretName | quote }}
                  key: POSTGRES_USER

            - name: POSTGRES_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $bootstrap.adminCredentialsSecretName | quote }}
                  key: POSTGRES_PASSWORD

            - name: E2E_DB_NAME
              value: {{ $databaseName | quote }}

            - name: E2E_DB_USER
              value: {{ $username | quote }}

            - name: E2E_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.retraining.database.credentialsSecretName | quote }}
                  key: POSTGRES_PASSWORD

          volumeMounts:
            - name: init-sql
              mountPath: /bootstrap
              readOnly: true

          command:
            - sh
            - -c

          args:
            - |
              set -eu

              if [ "$K8S_NAMESPACE" != "sentinel-dev" ] ||
                 [ "$E2E_DB_NAME" != "sentinel_e2e" ] ||
                 [ "$E2E_DB_USER" != "sentinel_e2e_user" ]; then
                  echo "ERROR: Invalid E2E database bootstrap target." >&2
                  exit 1
              fi

              test -n "$E2E_DB_PASSWORD"

              export PGPASSWORD="$POSTGRES_ADMIN_PASSWORD"

              role_privileged="$(psql -X -At \
                -h "$POSTGRES_HOST" -p "$POSTGRES_PORT" \
                -U "$POSTGRES_ADMIN_USER" -d postgres \
                -v ON_ERROR_STOP=1 \
                -c "SELECT rolsuper OR rolcreatedb OR rolcreaterole OR rolreplication
                    FROM pg_roles WHERE rolname = 'sentinel_e2e_user'")"

              if [ "$role_privileged" = "t" ]; then
                  echo "ERROR: Existing E2E role has elevated privileges." >&2
                  exit 1
              fi

              database_owner="$(psql -X -At \
                -h "$POSTGRES_HOST" -p "$POSTGRES_PORT" \
                -U "$POSTGRES_ADMIN_USER" -d postgres \
                -v ON_ERROR_STOP=1 \
                -c "SELECT pg_get_userbyid(datdba)
                    FROM pg_database WHERE datname = 'sentinel_e2e'")"

              if [ -n "$database_owner" ] &&
                 [ "$database_owner" != "$E2E_DB_USER" ]; then
                  echo "ERROR: Existing E2E database has an unexpected owner." >&2
                  exit 1
              fi

              psql -X -q -v ON_ERROR_STOP=1 \
                -h "$POSTGRES_HOST" -p "$POSTGRES_PORT" \
                -U "$POSTGRES_ADMIN_USER" -d postgres <<'SQL'
              \getenv target_user E2E_DB_USER
              \getenv target_password E2E_DB_PASSWORD
              \getenv target_database E2E_DB_NAME

              SELECT format(
                  'CREATE ROLE %I LOGIN PASSWORD %L NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION',
                  :'target_user',
                  :'target_password'
              )
              WHERE NOT EXISTS (
                  SELECT 1 FROM pg_roles WHERE rolname = :'target_user'
              )
              \gexec

              SELECT format(
                  'CREATE DATABASE %I OWNER %I',
                  :'target_database',
                  :'target_user'
              )
              WHERE NOT EXISTS (
                  SELECT 1 FROM pg_database WHERE datname = :'target_database'
              )
              \gexec
              SQL

              export PGPASSWORD="$E2E_DB_PASSWORD"

              psql -X -q -v ON_ERROR_STOP=1 \
                -h "$POSTGRES_HOST" -p "$POSTGRES_PORT" \
                -U "$E2E_DB_USER" -d "$E2E_DB_NAME" \
                -f /bootstrap/init.sql

              echo "E2E database bootstrap completed successfully."

      volumes:
        - name: init-sql
          configMap:
            name: {{ $bootstrap.initSqlConfigMapName | quote }}

{{- end }}
