registry:
  existingPullSecret: ""

worker:
  autoInference:
    enabled: true

driftDetection:
  enabled: true

  window: "5m"
  minimumPredictions: 20

  predictionDistribution:
    maxClassShare: 0.80

  alertFor: "1m"

prometheus:
  service:
    type: ClusterIP

alertmanager:
  enabled: true

  jenkinsWebhook:
    enabled: false
    alertName: "SentinelPredictionDistributionDrift"
    url: "http://jenkins.jenkins.svc.cluster.local:8080/generic-webhook-trigger/invoke"
    username: "sentinel-alertmanager"
    existingSecret: "sentinel-alertmanager-credentials"
    passwordKey: "password"

grafana:
  service:
    type: ClusterIP

retraining:
  clearml:
    apiHost: "http://192.168.49.1:8008"
    filesHost: "http://192.168.49.1:8081"
    webHost: "http://192.168.49.1:8080"

  canaryPromotion:
    enabled: false
    servingTaskId: "df15e55dabaf4489882f1c8c8f44ed7a"

opsFlags:
  retrainingEnabled: false
