registry:
  existingPullSecret: ""

worker:
  autoInference:
    enabled: true

driftDetection:
  enabled: true

  window: "5m"
  minimumPredictions: 20

  predictionDistribution:
    maxClassShare: 0.80

  alertFor: "1m"

prometheus:
  service:
    type: ClusterIP

alertmanager:
  enabled: true

  jenkinsWebhook:
    enabled: true
    alertName: "SentinelPredictionDistributionDrift"
    url: "http://jenkins.jenkins.svc.cluster.local:8080/generic-webhook-trigger/invoke"
    username: "sentinel-alertmanager"
    existingSecret: "sentinel-alertmanager-credentials"
    passwordKey: "password"

grafana:
  service:
    type: ClusterIP