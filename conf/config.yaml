project:
  name: Sentinel
  experiment_name: training-v1

training:
  batch_size: 32
  learning_rate: 0.001
  epochs: 10
  random_seed: 42
  validation_ratio: 0.2

model:
  name: cnn
  num_classes: 10
  registry_name: sentinel-mnist-torchscript
  version: v1
  output_path: artifacts/model-v1.pt

dataset:
  project: Sentinel
  name: mnist
  version: 1.0.0
  file_name: mnist.csv

runtime:
  device: cpu