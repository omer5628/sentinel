[project]
name = "sentinel"
version = "0.1.0"
description = "Enterprise-grade MLOps platform"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "clearml>=2.1.10",
    "clearml-serving>=1.3.5",
    "fastapi>=0.139.2",
    "httpx>=0.28.1",
    "hydra-core>=1.3.2",
    "numpy",
    "pandas",
    "pika>=1.4.2",
    "pillow>=12.3.0",
    "psycopg2-binary>=2.9.12",
    "pydantic>=2,<3",
    "redis>=8.0.1",
    "scikit-learn>=1.7.2",
    "streamlit>=1.60.0",
    "torch>=2.13.0",
    "tritonclient[grpc]>=2.71.0",
    "uvicorn>=0.51.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sentinel"]

[dependency-groups]
dev = [
    "matplotlib>=3.10.9",
    "pre-commit",
    "pyright",
    "pytest",
    "ruff",
]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = [
    ".git",
    ".venv",
    "external",
    "build",
    "dist",
]

[tool.ruff]
exclude = [
    ".git",
    ".venv",
    "build",
    "dist",
    "external",
]

[tool.pyright]
include = [
    "src",
    "tests",
]
exclude = [
    "**/node_modules",
    "**/__pycache__",
    "**/.*",
    ".venv",
    "external",
    "build",
    "dist",
]
